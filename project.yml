name: Solitaire
options:
  bundleIdPrefix: quebec.spe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # English is the source language of Localizable.xcstrings; French (Canada) is the translation.
  developmentLanguage: en
  generateEmptyDirectories: true
  # The Xcode version whose recommended settings the project has taken (LastUpgradeCheck).
  xcodeVersion: "27.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    # The version players see; a release is the tag v<MARKETING_VERSION> (see README, Releasing).
    MARKETING_VERSION: "1.0.0"
    # Local builds are build 1; the release workflow passes its run number, which only grows.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The compiler records every localisable string, so the catalog can be checked against the code.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Xcode 27.1's recommended settings.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
packages:
  SolitaireKit:
    path: SolitaireKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Solitaire:
    type: application
    platform: iOS
    sources:
      - path: Solitaire
    dependencies:
      - package: SolitaireKit
    info:
      path: Solitaire/Resources/Info.plist
      properties:
        # The launch screen is the felt alone, so the board appears without a flash.
        UILaunchScreen:
          UIColorName: Felt
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Split View and Stage Manager resize the window; the board scales the cards to fit.
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: quebec.spe.Solitaire
        # Signs local device builds; the release workflow passes its own team.
        DEVELOPMENT_TEAM: SGHB6DGT2T
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  SolitaireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SolitaireTests
    dependencies:
      - target: Solitaire
      - package: SolitaireKit
  SolitaireSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SolitaireSnapshotTests
        # The reference images are read by path, not from the bundle.
        excludes:
          - "__Snapshots__"
    dependencies:
      - target: Solitaire
      - package: SolitaireKit
      - package: SnapshotTesting
  SolitaireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SolitaireUITests
    dependencies:
      - target: Solitaire
schemes:
  Solitaire:
    build:
      targets:
        Solitaire: all
        SolitaireTests: [test]
        SolitaireSnapshotTests: [test]
        SolitaireUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # The app only: not the test bundles or SnapshotTesting. The engine is measured by its own
      # tests in CI (Scripts/coverage.sh engine).
      coverageTargets:
        - Solitaire
      targets:
        - SolitaireTests
        - SolitaireSnapshotTests
        - SolitaireUITests
