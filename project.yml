name: Solitaire
options:
  bundleIdPrefix: quebec.spe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  SolitaireKit:
    path: SolitaireKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Solitaire:
    type: application
    platform: iOS
    sources:
      - path: Solitaire
    dependencies:
      - package: SolitaireKit
    info:
      path: Solitaire/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: quebec.spe.Solitaire
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  SolitaireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SolitaireTests
    dependencies:
      - target: Solitaire
      - package: SolitaireKit
  SolitaireSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SolitaireSnapshotTests
    dependencies:
      - target: Solitaire
      - package: SolitaireKit
      - package: SnapshotTesting
  SolitaireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SolitaireUITests
    dependencies:
      - target: Solitaire
schemes:
  Solitaire:
    build:
      targets:
        Solitaire: all
        SolitaireTests: [test]
        SolitaireSnapshotTests: [test]
        SolitaireUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SolitaireTests
        - SolitaireSnapshotTests
        - SolitaireUITests
