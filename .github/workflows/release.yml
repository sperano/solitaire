name: Release

# Pushing the tag v<MARKETING_VERSION> (from project.yml) on a commit of main whose CI passed
# archives the app and uploads it to App Store Connect, where it becomes a TestFlight build.
# The build number is this workflow's run number, so every upload has a higher one.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    env:
      API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: xcodebuild -version
      - name: Set the work paths
        run: |
          echo "ARCHIVE=$RUNNER_TEMP/Solitaire.xcarchive" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Check the tag is the version, on main
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version, the MARKETING_VERSION in project.yml."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main; tag a commit of main."
            exit 1
          fi
      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "CI has not passed on $GITHUB_SHA; wait for it, or fix main and tag again."
            exit 1
          fi
      - name: Check the signing secrets are set
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          for name in API_KEY API_KEY_ID API_ISSUER_ID TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "$name is empty: add the App Store Connect secrets (README, Releasing)."
              exit 1
            fi
          done
          printf '%s\n' "$API_KEY" > "$API_KEY_PATH"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive -project Solitaire.xcodeproj -scheme Solitaire -configuration Release \
            -destination generic/platform=iOS -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID" \
            | xcbeautify --renderer github-actions
      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp AppStore/ExportOptions.plist "$options"
          plutil -insert teamID -string "$TEAM_ID" "$options"
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID" \
            | xcbeautify --renderer github-actions
      - name: Remove the API key
        if: always()
        run: rm -f "$API_KEY_PATH"
