name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs on this Xcode, the one the mactest Mac has, so lint, the engine's Swift and the
  # simulator tests match what an agent checks there (Scripts/select-xcode.sh).
  XCODE_VERSION: "27.2"

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: Scripts/select-xcode.sh "$XCODE_VERSION"
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - name: Show versions
        run: swiftlint version && swiftformat --version
      - name: SwiftFormat
        run: swiftformat --lint --reporter github-actions-log .
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  engine:
    name: SolitaireKit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: Scripts/select-xcode.sh "$XCODE_VERSION"
      - name: Run package tests
        working-directory: SolitaireKit
        run: swift test --parallel --enable-code-coverage
      - name: Coverage
        # Fails when the engine's own tests cover less than the minimum in Scripts/coverage.sh.
        run: Scripts/coverage.sh engine "$(cd SolitaireKit && swift test --show-codecov-path)"

  app:
    name: App unit and UI tests
    # Off on pull requests for now: the simulator tests take too long there. They still run on
    # every push to main, and before a PR locally (AGENTS.md).
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    env:
      # The steps run the Makefile's targets; its result bundles and failed snapshots are in build/.
      XCBEAUTIFY: xcbeautify --renderer github-actions
      # The simulators' iOS version: the one SNAPSHOT_SIMULATOR in the Makefile names.
      SIMULATOR_OS: "27.2"
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: Scripts/select-xcode.sh "$XCODE_VERSION"
      - name: Check the generated project is up to date
        run: |
          brew install xcodegen
          make check-project
      - name: Set up the simulators
        # Downloads the iOS runtime when the image lacks it; sets SIMULATOR and IPAD_SIMULATOR.
        run: Scripts/ci-simulators.sh "$SIMULATOR_OS" "iPhone 17" "iPad Pro 13-inch (M5)"
      - name: Unit tests
        run: make unit
      - name: Check the String Catalog matches the code
        # The unit tests built the app in the same DerivedData, so this build is incremental.
        run: make check-strings
      - name: Snapshot tests
        id: snapshots
        run: make snapshot
      - name: Upload the failed snapshots and their diffs
        if: failure() && steps.snapshots.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: build/snapshot-failures
          if-no-files-found: ignore
      - name: UI tests
        run: make ui
      - name: Layout and keyboard UI tests on iPad
        run: make ipad
      - name: Coverage
        # The app's lines run by the iPhone unit, snapshot and UI tests together; a report, no minimum.
        run: make app-coverage
