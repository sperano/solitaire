name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR: platform=iOS Simulator,name=iPhone 17

jobs:
  engine:
    name: SolitaireKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Run package tests
        working-directory: SolitaireKit
        run: swift test --parallel

  app:
    name: App unit and UI tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Check the generated project is up to date
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code -- Solitaire.xcodeproj
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project Solitaire.xcodeproj -scheme Solitaire \
            -destination "$SIMULATOR" -only-testing:SolitaireTests \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test -project Solitaire.xcodeproj -scheme Solitaire \
            -destination "$SIMULATOR" -only-testing:SolitaireUITests \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
