name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat
      - name: Show versions
        run: swiftlint version && swiftformat --version
      - name: SwiftFormat
        run: swiftformat --lint --reporter github-actions-log .
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  engine:
    name: SolitaireKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run package tests
        working-directory: SolitaireKit
        run: swift test --parallel

  app:
    name: App unit and UI tests
    # Off on pull requests for now: the simulator tests take too long there. They still run on
    # every push to main, and before a PR locally (AGENTS.md).
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    env:
      # The snapshot images are recorded on this simulator; the tests skip on any other.
      SNAPSHOT_SIMULATOR: platform=iOS Simulator,name=iPhone 17,OS=26.5
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version
      - name: Check the generated project is up to date
        run: |
          brew install xcodegen
          xcodegen generate
          changes=$(git status --porcelain --untracked-files=all -- Solitaire.xcodeproj)
          if [ -n "$changes" ]; then
            echo "Solitaire.xcodeproj is out of date; run xcodegen generate and commit:"
            echo "$changes"
            exit 1
          fi
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))')
          echo "SIMULATOR=id=$udid" >> "$GITHUB_ENV"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project Solitaire.xcodeproj -scheme Solitaire \
            -destination "$SIMULATOR" -only-testing:SolitaireTests \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Check the String Catalog matches the code
        # The unit tests built the app, so its extracted strings are in DerivedData.
        run: Scripts/string-catalog.sh check ~/Library/Developer/Xcode/DerivedData
      - name: Snapshot tests
        id: snapshots
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: |
          set -o pipefail
          xcodebuild test -project Solitaire.xcodeproj -scheme Solitaire \
            -destination "$SNAPSHOT_SIMULATOR" -only-testing:SolitaireSnapshotTests \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Upload the failed snapshots and their diffs
        if: failure() && steps.snapshots.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test -project Solitaire.xcodeproj -scheme Solitaire \
            -destination "$SIMULATOR" -only-testing:SolitaireUITests \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Pick an iPad simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPad")))')
          echo "IPAD_SIMULATOR=id=$udid" >> "$GITHUB_ENV"
      - name: Layout and keyboard UI tests on iPad
        run: |
          set -o pipefail
          xcodebuild test -project Solitaire.xcodeproj -scheme Solitaire \
            -destination "$IPAD_SIMULATOR" \
            -only-testing:SolitaireUITests/LayoutUITests -only-testing:SolitaireUITests/KeyboardUITests \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
